<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="menta" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="0.45" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f9488"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#064e47" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="tinta" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3b4442"/>
      <stop offset="0.35" stop-color="#101514"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="mancha" cx="0.78" cy="0.82" r="0.6">
      <stop offset="0" stop-color="#ccfbf1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ccfbf1" stop-opacity="0"/>
    </radialGradient>
    <filter id="relieve" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#053b36" flood-opacity="0.45"/>
    </filter>
    <clipPath id="forma"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>
    <g id="clave">
      <path d="M152 236 C144 150 196 104 262 104 C334 104 380 154 380 226 C380 326 288 396 158 436 L150 420 C250 378 314 316 314 230 C314 172 294 136 254 136 C222 136 200 158 198 192 Z"/>
      <circle cx="190" cy="226" r="42"/>
      <circle cx="424" cy="172" r="21"/>
      <circle cx="424" cy="270" r="21"/>
    </g>
  </defs>
  <g clip-path="url(#forma)">
    <rect x="24" y="24" width="464" height="464" fill="url(#menta)"/>
    <rect x="24" y="24" width="464" height="464" fill="url(#mancha)"/>
    <ellipse cx="256" cy="40" rx="330" ry="210" fill="url(#brillo)"/>
  </g>
  <rect x="27" y="27" width="458" height="458" rx="109" fill="none" stroke="url(#borde)" stroke-width="6"/>
  <!-- Relieve: sombra proyectada, canto claro abajo y canto de luz arriba -->
  <use href="#clave" transform="translate(-22 0)" fill="#ffffff" opacity="0.5" y="5"/>
  <g filter="url(#relieve)" transform="translate(-22 0)">
    <use href="#clave" fill="url(#tinta)"/>
  </g>
  <g transform="translate(-22 0)" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2.5" clip-path="none">
    <path d="M160 220 C158 156 204 112 262 112 C322 112 366 150 372 214"/>
  </g>
</svg>
