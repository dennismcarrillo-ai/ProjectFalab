[package]
name = "falab"
version = "0.1.0"
description = "falab: separación de stems, letras, acordes y mini-DAW, todo en local"
edition = "2021"

[lib]
name = "falab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
ureq = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
